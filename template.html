<!-- Source for every page. Edit this, then run: node tools/build.mjs -->
<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
{{HEAD}}
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/anime-eye-icon-64.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=anime-eye" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/anime-eye-touch-180.png" />
    <link rel="stylesheet" href="/style.css" />
    <script>
      // Landing intro (js/intro.js): on entering the site or reloading the landing page,
      // not when coming back to it from another page of the site.
      (function () {
        try {
          var nav = performance.getEntriesByType("navigation")[0],
            type = nav && nav.type,
            ref = document.referrer,
            internal = ref && new URL(ref).origin === location.origin;
          if (
            location.pathname === "/" &&
            !location.hash &&
            type !== "back_forward" &&
            !(internal && type !== "reload") &&
            !matchMedia("(prefers-reduced-motion: reduce)").matches
          ) {
            document.documentElement.classList.add("intro");
            // Failsafe: never leave the page covered if the intro doesn't start.
            setTimeout(function () {
              if (!document.querySelector(".intro-overlay"))
                document.documentElement.classList.remove("intro");
            }, 5000);
          }
        } catch (e) {}
      })();
    </script>
{{ANALYTICS}}
  </head>

    <a class="skip" href="#main">Skip to content</a>

      </button>
    </header>

    <!-- Pre-built by tools/build.mjs; js/app.js re-renders it with interactions -->
    <main id="main">{{MAIN}}</main>

</html>
